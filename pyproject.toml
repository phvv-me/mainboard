[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# `mb` is the import alias of `mainboard` (see `src/mb/__init__.py`), shipped beside it.
[tool.hatch.build.targets.wheel]
packages = ["src/mainboard", "src/mb"]

[tool.hatch.build.targets.wheel.force-include]
"README.md" = "mainboard/README.md"

[project]
name = "mainboard"
version = "0.5.6"
description = "One interface for environments, remote dispatch, and hardware: manifest, execution context, probe, profile."
readme = "README.md"
requires-python = ">=3.14"
license = "Apache-2.0"
authors = [{ name = "Pedro Valois" }]
dependencies = [
    "cyclopts>=4.23",
    # The state lake is a DuckLake at the ducklake extension's latest spec, which DuckDB 2.0
    # writes and an older engine refuses.
    "duckdb>=2.0.0",
    # The lake's tables, views and queries are SQLAlchemy Core, compiled to DuckDB's SQL by this
    # dialect (the maintained fork of duckdb_engine, released in step with DuckDB) and run on the
    # lake's own connections.
    "duckdb-sqlalchemy>=1.5.6",
    "sqlalchemy>=2.1.3",
    "pytz>=2025.2",
    # Hardware inventory is a core Mainboard verb, so the official CUDA host bindings cannot be
    # hidden behind an extra on Linux, where NVIDIA supports them. The wheel depends only on
    # cuda-pathfinder and locates installed CUDA/NVML libraries at runtime. macOS keeps its Apple
    # provider and never tries to resolve an unsupported NVIDIA wheel.
    "cuda-bindings>=13.0; sys_platform == 'linux'",
    "filelock>=4.0",
    # cuda-bindings 13.3.1 imports NumPy from its NVML extension but does not declare it in the
    # wheel metadata. Mainboard reads that official extension for inventory and sensors, so keep
    # its actual runtime dependency beside the binding until NVIDIA declares it upstream. On every
    # platform the analysis engine's Arrow functions in DuckDB need it too.
    "numpy>=2.0",
    "packaging>=24.0",
    # The analysis engine's fact base: Arrow frames into DuckDB.
    "pyarrow>=25.0",
    "patos>=0.0.13",
    "plumbum>=1.8",
    "pathspec>=0.12",
    "psutil>=6.0",
    "pydantic>=2.9",
    "rich>=13.0",
    "tenacity>=9.0",
    "tomlkit>=0.13",
    # `lint` refuses a YAML file that does not parse, the one syntax check the standard library
    # cannot make beside TOML's.
    "pyyaml>=6.0",
    # The one logger (`mainboard.log`), loguru's call shape with structured fields.
    "structlog>=26.1",
    # Every cloud's GPU offers in one catalog (dstack's, MPL-2.0): `mb host offers` and what
    # `host hold` rents on RunPod and Lambda.
    "gpuhunt>=0.1.30",
]

[project.optional-dependencies]
# The two adaptive lane kinds of `mainboard.trials`, each named after the lane rather than after
# its library, because the lane is what a workspace declares and the library is an implementation
# detail either one could replace. `mainboard.trials.lanes.adaptive.driver` imports them lazily and
# refuses by naming both the package and the extra, so a workspace that declares neither lane kind
# installs neither package and one that declares a lane without its driver is told exactly what to
# install rather than getting a `ModuleNotFoundError` from three frames down.
adversarial = ["hypothesis>=6.100"]
search = ["optuna>=4.0"]
# CUDA Core adds the higher-level device facade. Low-level runtime and NVML inventory are base
# functionality on Linux, so the extra contains only this richer layer.
cuda = ["cuda-core>=1.1; sys_platform == 'linux'"]
modal = ["modal>=1.0"]
# `mb plot` draws DuckDB results with seaborn; a workspace declares both in its own environment,
# so the tool installs them only when asked.
plot = ["matplotlib>=3.9", "seaborn>=0.13.2"]

[project.scripts]
# Every script pointing at the CLI is a name the tool answers to, and `core.project.Project`
# derives them all from this table: the shortest is the primary name every new file and folder
# takes, the others are legacy names read indefinitely.
mb = "mainboard.cli:main"
mainboard = "mainboard.cli:main"

# NO `pytest11` ENTRY POINT, and the reason is this file's own coverage gate. An entry-point
# plugin is imported by pytest before pytest-cov starts its engine, so every module the plugin
# pulls in has its definitions executed unmeasured and the whole trials subsystem reads as
# uncovered however thoroughly it is tested. A consumer registers the plugin with one line,
# `pytest_plugins = ["mainboard.trials.pytest_plugin"]` in its rootdir conftest, which is the
# ordinary way to register a plugin module and also keeps `--paid` and `--rerun` out of every
# unrelated pytest session on a machine this tool happens to be installed beside.

[dependency-groups]
# uv installs this group by default, so `uv sync` alone builds the whole gate. Every tool the
# gate runs belongs here, including the linters, since a checkout of this repository is all CI
# gets and nothing outside it supplies them.
dev = [
    # The plotting layer and the search driver are extras for consumers but part of the source
    # the type checkers read, so the gate installs them the way such a workspace would.
    "mainboard[plot,adversarial,search]",
    # The lake tests compare a printed document by the shape of its fields (`IsJson`, `IsStr`).
    "dirty-equals>=0.11",
    "mypy>=1.11",
    "pyrefly>=1",
    "pytest>=8.0",
    "ruff>=0.15",
    "types-psutil>=7.2.2.20260130",
    "types-seaborn>=0.13.2",
    "types-pyyaml>=6.0",
]

# The CI gate, the one definition every place that checks this package runs. `mainboard ci` runs
# it from a checkout, `mainboard ci --matrix` runs it on a host of each platform before a push, and
# the GitHub workflow is only a checkout and that same verb, so a step cannot pass locally and be
# missing on a runner, or the reverse. The first step is the lock: `--locked` refuses a uv.lock
# the manifest has moved past, which is the failure that used to reach CI before anyone ran it.
# Every step runs on both platforms, the type checkers included, since each narrows
# `sys.platform` branches to the host it runs on. The tests run the real `mb` (integration/).
#
# They run only through the isolated gate (integration/gates/README.md): the conftest refuses a
# bare `pytest`, because a test that rewrites the user's cache, lake or ssh config must not reach
# a real one. `uv run` hands the gate this checkout's environment, `seed` is the one lane that
# goes online (the sandbox has no network, so the DuckDB extensions are installed beforehand),
# and the report lands in `build/` for a failing job to upload. The sandbox itself is Seatbelt
# on macOS, which ships with it, and bubblewrap on Linux, which a runner prepares first
# (integration/gates/linux-runner.sh); a machine without either fails the step, never skips.
[tool.mypy]
python_version = "3.14"
# The CI step `mypy src` as a table, so `mainboard lint` (which runs mypy only where a project
# configures it) checks this package too.
files = ["src"]
# `mb lint` also hands mypy the integration tests, whose folders are no packages: each file is
# named from these roots, so a gate test's `from . import runner` and its worker's `guard` resolve.
explicit_package_bases = true
mypy_path = ["src", ".", "integration/gates/worker"]

# pyarrow ships no type stubs; the engine only builds Arrow arrays for DuckDB's functions.
[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true

# gpuhunt ships no type information; its offers are read through attribute access.
[[tool.mypy.overrides]]
module = ["gpuhunt", "gpuhunt.*"]
ignore_missing_imports = true

[tool.mainboard.ci]
os = ["linux", "osx"]

[[tool.mainboard.ci.steps]]
name = "lock"
run = "uv sync --locked"

[[tool.mainboard.ci.steps]]
name = "lint"
run = "uv run ruff check ."

[[tool.mainboard.ci.steps]]
name = "format"
run = "uv run ruff format --check ."

[[tool.mainboard.ci.steps]]
name = "mypy"
run = "uv run mypy src"

[[tool.mainboard.ci.steps]]
name = "pyrefly"
run = "uv run pyrefly check"

[[tool.mainboard.ci.steps]]
name = "seed"
run = "uv run sh integration/gates/run.sh seed --report build/gate-report"

[[tool.mainboard.ci.steps]]
name = "test"
run = "uv run sh integration/gates/run.sh suite --report build/gate-report --budget 1500"

# The contextual lane reads a hosted model, so it names one rather than inheriting the default
# `codex` backend this workspace retired. DeepSeek V4 Pro carries a one-million-token window,
# which is what lets a whole package's evidence ride in one pack instead of many.
[tool.mcmr.contextual]
backend = "openrouter"
model = "deepseek/deepseek-v4-pro-0813"
reasoning_effort = "medium"
timeout_seconds = 1800
candidate_budget = 768
prompt_token_budget = 640000
max_output_tokens = 384000

# Per-rule policy for what a frozen contract or an outside consumer keeps in place. Each entry
# names the reason the code cannot move, so a new occurrence still has to be argued rather than
# inheriting the exemption.

# What proves a fixed copy of mainboard still works: the gate suite, run inside the copy, which
# imports the copy's own source. `mb refactor fix` undoes every fix that fails it before writing.
[tool.mcmr]
proof = ["sh", "integration/gates/run.sh", "suite"]

# mainboard is a library the rest of the monorepo imports, and this checkout is only the package.
# The root facade and the profile facade are the published surfaces research code reaches
# (`from mainboard import Profile, gpu_busy`, `from mainboard.profile import Profiler`), so
# route liveness cannot be judged from this repository alone. Every export here without a
# monorepo consumer was already pruned, and what remains is consumed outside this checkout.
# The tracking initializer exports its sink module because importing it is what registers the
# sink under `Tracker`, the seam a fresh `mainboard submit` mints services through. The trials
# facade is the same case one subsystem inward: its whole audience is a consumer's conftest and
# a consumer's render, neither of which lives in this checkout.
[tool.mcmr.rules."PY-MODU0005"]
exclude = [
  "src/mainboard/__init__.py",
  "src/mainboard/profile/__init__.py",
  "src/mainboard/tracking/__init__.py",
  "src/mainboard/trials/__init__.py",
]

# pytest binds every test and fixture argument by name, never by position, so two adjacent
# same-typed parameters of a collected test cannot be transposed by any caller. The nvidia
# protocols and bindings type the CUDA, NVML and CUPTI entry points, whose C signatures fix the
# parameter order, and the tracer holds the callback CUPTI itself invokes positionally.
# `BoundedSshMachine.session` keeps plumbum's positional signature (ALL-PARA0003 says why), and a
# manifest template calls interpolate's scope functions positionally (`{{ env('HOME', '') }}`).
# Sealed research calls the trial API positionally (`log.settle("refuted", reason)`,
# `Artifacts(root, root / "evidence")`, `PATHS.device_table(tag, name)`), and a command's
# positional parameters are its documented command line (`rules swift-compare BASELINE CURRENT`).
[tool.mcmr.rules."ALL-PARA0001"]
exclude = [
  "src/mainboard/analysis/commands/swift/comparison.py",
  "src/mainboard/experiments/paths.py",
  "src/mainboard/trials/artifacts.py",
  "src/mainboard/trials/running/log.py",
  "src/mainboard/trials/session.py",
  "src/mainboard/dispatch/transport/core.py",
  "src/mainboard/manifest/render/interpolate.py",
  "src/mainboard/probe/providers/nvidia/protocols.py",
  "src/mainboard/profile/providers/nvidia/bindings.py",
  "src/mainboard/profile/providers/nvidia/tracer.py",
]

# The same name-binding argument: a parametrized Boolean rides into a test by argname, so the
# positional-flag trap the rule guards against cannot occur. `BoundedSshMachine.session`
# overrides plumbum's `SshMachine.session`, whose framework callers pass `isatty` and
# `new_session` positionally, so neither its flags nor their order are this package's to change.
[tool.mcmr.rules."ALL-PARA0003"]
exclude = ["src/mainboard/dispatch/transport/core.py"]

# The CLI verbs (`verbs/`, and the `rules` commands' `--write` and `--unsafe`) are the published
# terminal surface: `--json`, `--agent`, `--dev` and `--resolve` are flags users and agents already
# pass, and cyclopts renders each as its own named option, so the combination count lives in the
# command line contract rather than in a refactorable body.
# `curator`, `provisioner` and `render/present` carry those same flags one seam inward as data,
# and `transport` overrides plumbum's own `session` signature. Test signatures take the same
# flags by parametrized name.
[tool.mcmr.rules."ALL-PARA0004"]
exclude = [
  "src/mainboard/verbs",
  "src/mainboard/analysis/engine/lint/verbs.py",
  "src/mainboard/deps/curator.py",
  "src/mainboard/dispatch/transport/core.py",
  "src/mainboard/engines/compile/provisioner.py",
  "src/mainboard/render/present.py",
]

# Each of these types is a record whose field count belongs to the shape it mirrors: a manifest
# table a user writes, a scheduler's job description, a provider's catalog row, a CUPTI or NVML
# reading, a profile report row. Narrowing the record would drop a field of the external shape.
# The test files mirror the SDK surfaces their doubles stand in for. A trials `Session` is one
# run of a universe, and its eight fields are eight facts about that run: its identity, what it
# declared, the provenance every row carries, the flag baseline, the open stores, the collected
# lanes, the claim now resident and the first trial that moved a flag. None is derivable from
# another and dropping any one loses a column of the receipt or a line of the refusal.
[tool.mcmr.rules."ALL-CLAS0004"]
exclude = [
  "src/mainboard/trials/session.py",
  "src/mainboard/batch/estimate/core.py",
  "src/mainboard/batch/spec.py",
  "src/mainboard/costs/catalog.py",
  "src/mainboard/dispatch/jobs/spec.py",
  "src/mainboard/dispatch/hosts/onboard/record.py",
  "src/mainboard/dispatch/state/cache.py",
  "src/mainboard/dispatch/mirroring/sync.py",
  "src/mainboard/dispatch/transport/targets.py",
  "src/mainboard/dispatch/jobs/vocabulary.py",
  "src/mainboard/engines/compile/ecosystems/base.py",
  "src/mainboard/engines/compile/pixi/manifest.py",
  "src/mainboard/manifest/schema",
  "src/mainboard/probe/readings/snapshot.py",
  "src/mainboard/probe/units/cpu.py",
  "src/mainboard/profile/result/efficiency.py",
  "src/mainboard/profile/result/models.py",
  "src/mainboard/profile/profiler.py",
  "src/mainboard/profile/formats/protocols.py",
  "src/mainboard/profile/providers/nvidia/collector.py",
  "src/mainboard/profile/bottleneck/report.py",
  "src/mainboard/profile/result/core.py",
  "src/mainboard/profile/trace.py",
  "src/mainboard/tracking/sampler.py",
  "src/mainboard/waiting/verdicts.py",
]

# House docstring style forbids file docstrings, so a module's design rationale lives in its
# opening comment group, and this workspace deliberately writes those decision logs long. The
# comment is the sanctioned home for the why, and trimming it to a token budget would delete
# exactly the record the house rules ask us to keep.
[tool.mcmr.rules."ALL-COMM0001"]
exclude = ["src"]

# `Host` and `Machine` are the one-per-process hardware facade: the probe's lifetime is exactly
# the instance's, and the test suite resets probing by dropping the singleton, which a module
# level cache would survive. The instance cache is the seam that keeps the suite hermetic.
[tool.mcmr.rules."PY-CACH0001"]
exclude = ["src/mainboard/probe"]

# gpuhunt names its offline catalogs only in `_internal`; `offers.py` is the one adapter over it,
# and `test_clouds.py` imports it, so an upgrade that moves the name fails there first.
[tool.mcmr.rules."PY-IMPO0007"]
fence = ["src/mainboard/dispatch/backends/cloud/offers.py"]

# Every flagged field sits on a patos `FrozenModel`, which is hashable, and hashing needs
# hashable field values. A list field would take the whole model's hash away, so the homogeneous
# tuple is the required representation rather than a stylistic choice.
[tool.mcmr.rules."PY-PYDA0007"]
exclude = ["src"]

# A span decorator's protected region is the delegated iteration itself: the generator body it
# wraps runs inside the `try` so the `finally` can record the wall time however the iteration
# ends. The loop plus its `yield` is the smallest spelling of that contract.
[tool.mcmr.rules."PY-EXCE0002"]
exclude = ["src/mainboard/profile/spans.py"]

# `id` is the domain word for a batch and a watch identity, the same field `Handle.id` spells,
# and `go` is the Go ecosystem's own name. Lengthening either would replace the domain
# vocabulary with filler.
[tool.mcmr.rules."ALL-NAMI0001"]
exclude = [
  "src/mainboard/batch/runner.py",
  "src/mainboard/batch/watch.py",
]

# This package's collection policy is immutable by default: results are hashable patos
# `FrozenModel` values whose homogeneous fields are tuples (see the PY-PYDA0007 entry), so a
# `tuple` or `frozenset` constructor states the design at exactly the boundary the value is
# frozen.
[tool.mcmr.rules."PY-COLL0004"]
exclude = ["src"]

# The fixed pairs the rule still flags are records: the `(domain, id)` handle nvtx hands back,
# and a parametrized `(env, script)` expectation.
# Loosening them to `Sequence` would lose exactly the pair shape their readers destructure.
# `pytest_collection_modifyitems` takes a `list` because pytest's own hookspec does, and a
# plugin that narrowed it would be describing a different hook from the one it implements.
[tool.mcmr.rules."PY-COLL0001"]
exclude = [
  "src/mainboard/profile/providers/nvidia/bindings.py",
  "src/mainboard/trials/pytest_plugin.py",
]

# One module holds one closed type family, the shapes of one contract, named by the module
# comment: `receipts` is the event contract, `vocabulary` the verdict words, `estimate` the
# pricing rows. A class per module would multiply the modules ALL-FILE0003 folds five to a
# folder, and the family-per-module layout is the one the house architecture asks to keep.
[tool.mcmr.rules."ALL-MODU0005"]
exclude = ["src"]

# The house testing policy is maximum coverage from minimum test count, so a test is one dense
# scenario or property with its whole story in one body, and helpers take their axes as named
# keywords. Splitting to a ten-statement ceiling would multiply the test count the policy
# exists to hold down. In `src`, `cli.build` is the declarative verb table whose statement
# count is the roster's length.
[tool.mcmr.rules."ALL-FUNC0001"]
exclude = ["src/mainboard/cli.py"]

[tool.mcmr.rules."ALL-FUNC0010"]
exclude = ["src/mainboard/cli.py"]

# mainboard is a standalone published package, and the house `common.log` logger lives in the
# monorepo tree this checkout cannot depend on, so module-level `logging.getLogger(__name__)`
# is the library-correct spelling of the same convention.
[tool.mcmr.rules."PY-LOGG0001"]
exclude = ["src"]

# `gpu_busy` and `wait_for_idle` are published API names research code already imports
# (`from mainboard import wait_for_idle`), so renaming them to an `is_` prefix breaks every
# consumer for a hint the docstrings already carry.
[tool.mcmr.rules."PY-NAMI0001"]
exclude = ["src/mainboard/probe/readings/gating.py", "src/mainboard/profile/bottleneck/core.py"]

# Docstrings are English prose, and English sentences legitimately open with articles. A
# thirty percent opener cap on a six-sentence section forbids two `The` sentences, which is a
# constraint on grammar rather than on repetition worth flagging.
[tool.mcmr.rules."ALL-WRIT0005"]
exclude = ["src"]

# `__getattr__` is the PEP 562 hook the interpreter itself calls, `script` and `sh` are root
# facade exports consumed outside this checkout, and the protocol classes type the optional
# CUDA, NVML and profiling SDK surfaces that appear only in annotations.
# Every `pytest_` function in the plugin is called by pluggy off its own hookspec, so no
# reference to one exists anywhere and none ever will.
[tool.mcmr.rules."ALL-REAC0001"]
exclude = [
  "src/mainboard/__init__.py",
  "src/mainboard/core/execution/shell.py",
  "src/mainboard/probe/providers/nvidia/protocols.py",
  "src/mainboard/profile/formats/protocols.py",
  "src/mainboard/profile/spans.py",
  "src/mainboard/trials/pytest_plugin.py",
]

# These prints are the product, not debris: `render/present` is the CLI's one output seam, and
# the benchmark and stage reports print their tables for the person who asked for them.
[tool.mcmr.rules."ALL-CONT0003"]
exclude = [
  "src/mainboard/render/present.py",
  "src/mainboard/profile/benchmark.py",
  "src/mainboard/profile/studies/stages.py",
]

# `vars` over a module namespace is the profiler's discovery mechanism for the code objects it
# owns.
[tool.mcmr.rules."ALL-FUNC0011"]
exclude = ["src/mainboard/profile/profiler.py"]

# The schedulers are `Scheduler` registry implementations: the class is the unit runtime
# dispatch selects by kind, so a namespace of verbs is its whole job. `Fabric` is a frozen
# fact model whose classmethods build it from sysfs. `Local` and `Fleet` are the same shape one
# subsystem over: each implements the `Distribution` protocol, and the class is what a caller
# substitutes, so two verbs is exactly the size of the contract.
[tool.mcmr.rules."PY-CLAS0003"]
exclude = [
  "src/mainboard/dispatch/schedulers",
  "src/mainboard/probe/facts/devices/fabric.py",
]

# `Tracker` and `Delivery` are registry roots, the published extension seams a new sink or
# provider subclasses into. How many implementations exist today is not the contract.
# `Figures` is a seam whose implementations are the CONSUMER'S renders: the whole design is that
# the refusal, the current-view read and the determinism check live here and the plotting does not,
# so the only subclass in this repository will always be the one its own test declares.
[tool.mcmr.rules."PY-INTE0002"]
exclude = [
  "src/mainboard/dispatch/backends/base.py", "src/mainboard/tracking/base.py",
  "src/mainboard/trials/contract/figures.py",
]

# Each subsystem names its own faults where they arise: `core.errors` holds the workspace-wide
# `MissionError`, transport holds the connectivity family every scheduler shares.
[tool.mcmr.rules."PY-EXCE0003"]
exclude = ["src/mainboard/core/errors.py", "src/mainboard/dispatch/transport/core.py"]

# The ancestry the rule counts is the patos `Registry` plus pydantic stack under every provider
# backend, not a hierarchy this package can flatten.
[tool.mcmr.rules."ALL-CLAS0005"]
exclude = ["src/mainboard/dispatch/backends"]

# `bool | None` here is a genuine tri-state: an offer whose provider never said whether it is
# available, and a launch whose module-or-script choice is inferred from evidence when unset.
[tool.mcmr.rules."PY-TYPE0002"]
exclude = ["src/mainboard/costs/catalog.py", "src/mainboard/profile/profiler.py"]

# The facade `__getattr__` answers any exported name, and `object` is the exact type typeshed
# gives the PEP 562 hook.
[tool.mcmr.rules."PY-TYPE0004"]
exclude = ["src/mainboard/__init__.py"]

# An `except ...: continue` in these loops is a candidate filter, not a swallowed fault: an
# unreadable version string, a kernel lock Windows gave up waiting on, a path a mirror prunes
# that another pass already removed are each skipped so the loop can keep what the host really
# offers.
[tool.mcmr.rules."ALL-ERRO0001"]
exclude = [
  "src/mainboard/deps/indexes.py",
  "src/mainboard/dispatch/agent/program/transfer.py",
]

# The two waivers are the house-sanctioned `reason=`-stamped form for genuine third-party stub
# gaps, which is exactly what the coding rules permit them for.
[tool.mcmr.rules."ALL-WAIV0001"]
exclude = ["src/mainboard/engines/compile/generated/files.py"]

# `Nvml` is a typed mirror of NVML's own C namespace, so its method count is the vendor's rather
# than ours, and the test double stands in for that same namespace method for method.
[tool.mcmr.rules."ALL-CLAS0003"]
exclude = ["src/mainboard/probe/providers/nvidia/protocols.py"]

# Same mirror argument one level out: every NVML entry point the provider calls has to be
# declared, and each enum those calls index into needs its own protocol, because they are
# separate objects with separate members. Splitting the module would state a boundary NVML
# does not have.
# A plugin's member count is pytest's hook list plus two fixtures, which is not ours to shorten,
# and the verdict reader's is one settled-row shape per evidence shape it reads.
# The verdict reader gained the receipts-store branch, which is one more evidence shape read
# through the same settled-row surface rather than a second module a caller has to know about.
[tool.mcmr.rules."ALL-MODU0001"]
exclude = ["src/mainboard/waiting/verdicts.py"]

[tool.mcmr.rules."ALL-MODU0006"]
exclude = ["src/mainboard/waiting/verdicts.py"]

[tool.mcmr.rules."ALL-MODU0002"]
exclude = [
  "src/mainboard/probe/providers/nvidia/protocols.py",
  "src/mainboard/trials/pytest_plugin.py",
  "src/mainboard/waiting/verdicts.py",
]

# `profile` reaching `probe.units` is the one deliberate edge between them, and it buys the whole
# default: a session that wants device evidence and was handed no probe finds the host's own
# cards instead of collecting nothing. The alternative is a registration seam whose only member
# would be the probe package, which is the same dependency written indirectly.
[tool.mcmr.rules."ALL-ARCH0003"]
exclude = ["src/mainboard/profile"]

# The cyclopts verbs must each exist as a function for the CLI table, one line or not.
[tool.mcmr.rules."ALL-FUNC0004"]
exclude = ["src/mainboard/cli.py"]

# tomlkit and the interpolation engine hand back plain Python values, so rendering a compiled
# table or a template result has to ask what each value is. There is no capability to depend on
# at that boundary, the same disposition chefe records for its own pixi compiler.
[tool.mcmr.rules."PY-INTE0001"]
exclude = [
  "src/mainboard/engines/compile/backend/pixi/core.py",
  "src/mainboard/engines/compile/pixi/manifest.py",
  "src/mainboard/engines/compile/pixi/paths.py",
  "src/mainboard/manifest/render/interpolate.py",
]

# `annotate` is the flat annotation facade over the detected tracer, so its functions are thin
# delegations on purpose, the same shape as the root facade's exports. `center/remote.py` is the
# program a migration ships to its destination, and the carrier calls its functions by name over
# the wire (`carrier.call("census", ...)`), so each one-line entry is the remote verb itself.
# `durable.settler` is the one public seam over the private `_SETTLERS` registry; inlining it
# would hand that registry to `doctor`.
[tool.mcmr.rules."ALL-FUNC0005"]
exclude = [
  "src/mainboard/center/migration/remote.py",
  "src/mainboard/settling/durable/core.py",
  "src/mainboard/profile/bottleneck/annotate.py",
]

# `log.py` is the logger: its stderr sink and its `result` and `prompt` streams are the one place
# the tool writes to a stream itself. The census also runs on a machine without mainboard (below).
[tool.mcmr.rules."PY-LOGG0002"]
exclude = ["src/mainboard/log/core.py", "src/mainboard/probe/census.py"]

# Programs sent to another machine as source and run by its bare Python (the collection script,
# the migration agent's census) import the standard library alone: their constants stay in them,
# and the census answers on stdout itself. `test_standalone_programs.py` runs them that way.
[tool.mcmr.rules."PY-CONS0001"]
exclude = ["src/mainboard/dispatch/collection/pack.py"]

[tool.mcmr.rules."PY-CONS0002"]
exclude = ["src/mainboard/dispatch/collection/collector.py"]

# psutil's partition namedtuple and CUPTI's raw records are not models, so the projections that
# adapt them into typed rows must spell the fields at that third-party boundary.
[tool.mcmr.rules."PY-MODE0004"]
exclude = [
  "src/mainboard/probe/facts/storage/partition_info.py",
  "src/mainboard/profile/providers/nvidia/delivery.py",
]

# Where each test folder that names no source package goes, decided once by the owner: the first
# folder under `integration/` must be a package or module of `src/mainboard`, and a leaf name
# several packages share (`lake`, `evidence`, `workspace`) cannot pick one. `machines` is left
# unresolved on purpose, since its one same-named package (`verbs/machines`) is a false match.
[tool.mcmr.rules."ALL-TEST0004"]
targets = { lake = "state/lake", evidence = "state/evidence", environments = "engines/environments", workspace = "verbs/workspace", swift = "analysis/swift", reverse = "probe/reverse", machines = "" }

# Without this table pyrefly walks upward looking for one and adopts whatever manifest it finds,
# which inside a monorepo checkout means scanning the whole tree. Naming the package's own source
# and interpreter keeps the gate reading the same files in every checkout.
[tool.pyrefly]
project-includes = ["src/**/*.py"]
python-version = "3.14"
# A gate test imports its worker's `guard` by name, as the worker puts its folder on the path.
search-path = ["src", ".", "integration/gates/worker"]

[tool.ty.environment]
python-version = "3.14"
extra-paths = ["integration/gates/worker"]

[tool.pytest.ini_options]
# `integration/` runs the real `mb` in throwaway workspaces and is what a bare `pytest` runs.
addopts = "-q -ra --strict-markers --import-mode=importlib"
testpaths = ["integration"]
markers = ["swift_native: real SwiftSyntax source execution in the macOS/Xcode 27 lane"]
strict_config = true
strict_parametrization_ids = true
strict_xfail = true

# The lint rules are spelled out here rather than extended from a parent manifest. This
# repository is checked out on its own by CI and by anyone who clones it, so a path reaching
# above its root resolves to nothing and takes ruff down with it.
[tool.ruff]
line-length = 99
target-version = "py314"

# The README's example block aligns its trailing comments into a column on purpose, and ruff
# formats fenced Python inside markdown, so the prose stays out of the formatter's reach.
[tool.ruff.format]
exclude = ["*.md"]

[tool.ruff.lint]
preview = true
# The same set patos, chefe and lote select, so one habit covers every house package, plus the
# encoding rule this one adds because it reads and writes manifests on three operating systems,
# and the banned-api rule that keeps dataclasses out.
select = ["E", "F", "I", "UP", "B", "SIM", "PLW1514", "TID251"]

# The owner's rule is no dataclasses: a record is a patos model. The two remote scripts
# (`dispatch/agent/program/`, `dispatch/collection/pack.py`) run on hosts with the standard
# library alone and use none; one that ever needs one takes a per-file ignore, not a model.
# A rule's SQL and its good/bad examples are verbatim text the engine runs and compares, so a long
# line in them is part of the rule, not prose to wrap.
[tool.ruff.lint.per-file-ignores]
"src/mainboard/analysis/rules/**" = ["E501"]
# Shipped to a destination that has no mainboard yet, so its result is a bare print.
"src/mainboard/center/standalone.py" = ["T201"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"dataclasses".msg = "Use patos's Model, FrozenModel, FlexModel or FrozenFlexModel (`from patos import ...`); pydantic refuses positional arguments, so construct with keywords."
