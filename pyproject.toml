[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mainboard"
version = "0.1.0"
description = "One interface for environments, remote dispatch, and hardware: manifest, execution context, probe, profile."
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
authors = [{ name = "Pedro Valois" }]
dependencies = [
    "cyclopts>=3.0",
    "filelock>=3.13",
    "jinja2>=3.1",
    "packaging>=24.0",
    "patos>=0.0.12",
    "plumbum>=1.8",
    "pathspec>=0.12",
    "psutil>=6.0",
    "pydantic>=2.9",
    "rich>=13.0",
    "tenacity>=9.0",
    "tomlkit>=0.13",
]

[project.optional-dependencies]
cuda = ["cuda-bindings>=13.0", "cuda-core>=1.1"]
modal = ["modal>=1.0"]

[project.scripts]
mainboard = "mainboard.cli:main"

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-subprocess>=1.5",
]

[tool.pytest.ini_options]
addopts = "-q -ra --strict-markers --cov=mainboard --cov-branch"
testpaths = ["tests"]
strict_config = true
strict_parametrization_ids = true
strict_xfail = true

[tool.coverage.run]
branch = true

[tool.coverage.report]
fail_under = 100
show_missing = true
exclude_also = ["if TYPE_CHECKING:"]

[tool.uv.sources]
patos = { path = "../patos", editable = true }

[tool.ruff]
extend = "../../pyproject.toml"
target-version = "py314"

[tool.ruff.lint]
preview = true
extend-select = ["PLW1514"]
