name: GPU integration (self-hosted)

# Real NVIDIA/Grace integration on a self-hosted runner (e.g. gold, a GB10).
# One-time setup: on the GPU box, install the GitHub Actions runner from
#   Settings -> Actions -> Runners -> New self-hosted runner
# and give it the `linux` and `gpu` labels. Manual only, because a scheduled run with no runner
# registered simply queues until the 24 hour limit cancels it, which reads as a red
# workflow every week and says nothing about the code.

on:
  workflow_dispatch:

jobs:
  nvidia:
    runs-on: [self-hosted, linux, gpu]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # the legacy-runtime witness extracts the c97cb81 archive from history
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
      - run: uv sync --locked
      # the hermetic gate first, so a real-hardware failure below is unambiguous. Its sandbox is
      # bubblewrap, which this script installs and lets an unprivileged user run with sudo, so the
      # runner's user needs passwordless sudo or the AppArmor sysctl lifted beforehand.
      - run: sh integration/gates/linux-runner.sh
      - run: uv run --locked mainboard ci
      # then assert a GPU was actually detected on this box
      - run: |
          uv run python - <<'PY'
          from mainboard import Machine

          snap = Machine().snapshot()
          assert snap.gpus, "no GPU detected on the self-hosted runner"
          gpu = snap.gpus[0]
          print("detected:", gpu.unit_name, gpu.vendor, gpu.memory.total_bytes)
          assert gpu.memory.total_bytes > 0, "GPU reported zero memory"
          PY
