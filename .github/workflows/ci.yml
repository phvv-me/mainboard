name: CI

on:
  pull_request:
  workflow_call: # publish.yml runs this exact gate on main before publishing
  workflow_dispatch: # manual runs (e.g. to validate main directly between releases)

# The gate itself is `[tool.mainboard.ci]` in pyproject.toml, and `mainboard ci` is the only thing
# that runs it, here, on a developer's machine and across `--matrix` alike. This file only
# chooses the runners and bootstraps what a runner lacks, so it has nothing left to drift from. A
# runner of a platform the table does not support fails the job rather than checking nothing.
jobs:
  gate:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # the legacy-runtime witness extracts the c97cb81 archive from history
      # A published package stands on its own, so the bootstrap is the official uv action and
      # nothing of ours. `requires-python` is `>=3.14`, which setup-uv provisions even when the
      # runner image does not carry it.
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
          enable-cache: true
      # The tests run only inside the OS-isolated gate (integration/gates/README.md). macOS ships
      # Seatbelt and zsh; Ubuntu needs bubblewrap and zsh, and 24.04 forbids bubblewrap its user
      # namespaces until the AppArmor sysctl is lifted. That changes the whole machine, which a
      # throwaway runner allows and `[tool.mainboard.ci]` must never do to a developer's.
      - if: runner.os == 'Linux'
        run: sh integration/gates/linux-runner.sh
      # `--locked` refuses a stale lock before the tool that checks for one is even installed.
      - run: uv run --locked mainboard ci
      # `mainboard ci` shows a step's own output, and the gate keeps each test's in its report.
      - if: failure()
        run: tail -n 150 build/gate-report/suite.log || true
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: gate-report-${{ matrix.os }}
          path: build/gate-report
          if-no-files-found: ignore
