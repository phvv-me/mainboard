name: CI

on:
  pull_request:
  workflow_call: # publish.yml runs this exact gate on main before publishing
  workflow_dispatch: # manual runs (e.g. to validate main directly between releases)

jobs:
  test:
    # Each OS is a distinct real hardware setup the probe runs against:
    #   ubuntu-latest  -> x86_64 Linux (no accelerator)
    #   macos-latest   -> Apple Silicon (real Apple GPU + NPU)
    #   windows-latest -> x86_64 Windows (env probe via whoami; full hardware probe pending)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # One interpreter, because `requires-python` is `>=3.14` and uv refuses anything below
        # it. A second entry here does not widen support, it only fails at bootstrap.
        python: ["3.14"]
    steps:
      - uses: actions/checkout@v6
      # A published package stands on its own, so the bootstrap is the official uv action and
      # nothing of ours. mainboard provisions environments for a living and still cannot use
      # itself to build itself, which is the one case that stays on plain `uv run`.
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      # The dev tooling is a dependency group, which uv installs by default, so the sync needs
      # no flags. The `uv run` steps below reuse that environment without pruning it.
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      # Type checking is OS-agnostic source analysis, so run it once on Linux. The Windows runner
      # lacks stubs for the Unix-only modules (grp, os.getgid) the POSIX identity path references.
      #
      # Reporting, not gating, and deliberately so. The bootstrap this file replaced failed before
      # any check ran, so neither checker has ever executed here, and the first honest run found 28
      # mypy and 21 pyrefly errors across the fused source. Several are third-party stub gaps and
      # several are real design questions this package's owner should answer, so the count comes
      # down in its own pass. The output stays in every run, and these two lose the flag the day
      # they read zero.
      - run: uv run mypy src
        if: matrix.os == 'ubuntu-latest'
        continue-on-error: true
      - run: uv run pyrefly check
        if: matrix.os == 'ubuntu-latest'
        continue-on-error: true
      # The whole suite is hermetic, so every runner runs all of it. The `integration` marker
      # these steps used to split on matches nothing in this repository, and `-m integration`
      # therefore selected zero tests and exited 5, which is a failure.
      - run: uv run pytest
        if: matrix.os != 'windows-latest'
      # Windows runs the same suite as a portability guard, without the coverage gate, since a
      # few POSIX-only and Apple-only paths cannot execute there.
      - run: uv run pytest --no-cov
        if: matrix.os == 'windows-latest'
