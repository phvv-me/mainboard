name: CI

on:
  pull_request:
  workflow_call: # publish.yml runs this exact gate on main before publishing
  workflow_dispatch: # manual runs (e.g. to validate main directly between releases)

jobs:
  test:
    # Linux only, because that is where this suite actually runs today.
    #
    # The matrix used to name macOS and Windows on the theory that each is a distinct real
    # hardware setup worth probing, but the bootstrap failed before pytest on every leg, so
    # nobody saw that neither one can run it. `tests/conftest.py` imports `fcntl`, which does
    # not exist on Windows, so collection dies before the first test. On macOS the workspace
    # snapshot asserts `linux-arm64` against a host that reports `macos-arm64`, and one submit
    # test wants a container runtime no macOS runner has.
    #
    # Restoring them is real work on the suite, not on this file: make the snapshot read the
    # host platform, skip the container test where no runtime exists, and put the POSIX-only
    # imports behind a guard. The `runs-on` list comes back the day those pass.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # One interpreter, because `requires-python` is `>=3.14` and uv refuses anything below
        # it. A second entry here does not widen support, it only fails at bootstrap.
        python: ["3.14"]
    steps:
      - uses: actions/checkout@v6
      # A published package stands on its own, so the bootstrap is the official uv action and
      # nothing of ours. mainboard provisions environments for a living and still cannot use
      # itself to build itself, which is the one case that stays on plain `uv run`.
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      # The dev tooling is a dependency group, which uv installs by default, so the sync needs
      # no flags. The `uv run` steps below reuse that environment without pruning it.
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      # Reporting, not gating, and deliberately so. The bootstrap this file replaced failed before
      # any check ran, so neither checker has ever executed here, and the first honest run found 28
      # mypy and 21 pyrefly errors across the fused source. Several are third-party stub gaps and
      # several are real design questions this package's owner should answer, so the count comes
      # down in its own pass. The output stays in every run, and these two lose the flag the day
      # they read zero.
      - run: uv run mypy src
        continue-on-error: true
      - run: uv run pyrefly check
        continue-on-error: true
      # The suite is hermetic and runs in full. The `integration` marker this step used to split
      # on matches nothing in this repository, and `-m integration` therefore selected zero tests
      # and exited 5, which is a failure.
      - run: uv run pytest
